<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ClassCast Offline — Share. Present. Learn. Offline classroom document sharing over local Wi-Fi.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="theme-color" content="#3568F5">

<body>
  <!-- Syncfusion's PDF viewer renders through PdfJs on the web platform and
       will not display anything until this global is present. -->
  <script type="module" async>
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.worker.min.mjs";
    window['pdfjsLib'] = pdfjsLib;
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
