name: Generate release key

# Run once, by hand, to create android/classcast-release-key.jks and commit it.
#
# It exists because android/ is not in the repo: every build used to run
# `flutter create .` on a clean checkout, which makes a brand new throwaway
# debug key. Every release was therefore signed differently, so a phone that
# had v1.1.0 installed could never install v1.1.3 over it — Android refused
# with "the package appears to be invalid". The key has to exist in the repo
# for the signature to be the same on every build.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  key:
    name: Generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate the signing key
        run: |
          set -euo pipefail
          mkdir -p android
          if [ -f android/classcast-release-key.jks ]; then
            echo "Key already exists — refusing to overwrite it."
            echo "Generating a new one would invalidate every installed build."
            exit 0
          fi
          # Alias and passwords are Flutter's own debug-key values on purpose:
          # the generated Android template signs release builds with
          # signingConfigs.debug, which hardcodes these. Reusing them means the
          # build needs no template patching at all — the CI job just copies
          # this file over android/app/debug.keystore.
          keytool -genkeypair -v \
            -keystore android/classcast-release-key.jks \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10950 \
            -dname "CN=ClassCast Offline, OU=MerjDev, O=MerjDev, C=PH"
          keytool -list -v \
            -keystore android/classcast-release-key.jks \
            -storepass android | head -20

      - name: Commit the key
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet --cached -- android/classcast-release-key.jks \
            && [ -z "$(git status --porcelain -- android/classcast-release-key.jks)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git add -f android/classcast-release-key.jks
          git commit -m "Add the release signing key

          Every release was signed with a throwaway key because android/ is not
          in the repo and 'flutter create .' ran fresh on each build. That made
          every version un-installable over the last one. This key has to be
          stable for as long as the app exists."
          git push origin HEAD:${{ github.ref_name }}