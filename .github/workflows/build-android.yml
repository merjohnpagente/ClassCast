name: Build Android APK

# ClassCast Offline Android pipeline (JohnFood-style):
# TEST first, BUILD only when green. No Flutter SDK needed locally —
# everything runs here. GitHub Actions only builds the APK; the
# classroom local backend runs on the teacher device, not in CI.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---- 1) TEST: analyze + all tests. The APK waits for this. ----
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap platform folders if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name classcast_offline --org com.classcast.offline
          fi
          # flutter create drops a default counter test — ours are test/app_test.dart + test/widget_smoke_test.dart
          rm -f test/widget_test.dart
          git checkout -- web/index.html web/manifest.json || true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  # ---- 2) BUILD APK (only when Test is green) ----
  apk:
    name: APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap platform folders if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name classcast_offline --org com.classcast.offline
          fi
          rm -f test/widget_test.dart
          git checkout -- web/index.html web/manifest.json || true

      - name: Configure Android (label, permissions, compileSdk 36)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="ClassCast Offline"/' "$MANIFEST"

          # Permissions: QR scan (camera), Wi-Fi info for the joining address,
          # and local networking for the Android-hosted server (phase 6).
          # Insert before the closing <application> tag.
          python3 - "$MANIFEST" <<'PY'
          import sys, re
          path = sys.argv[1]
          src = open(path, encoding="utf-8").read()
          perms = [
              '<uses-permission android:name="android.permission.CAMERA"/>',
              '<uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>',
              '<uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>',
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>',
          ]
          missing = [p for p in perms if p not in src]
          if missing:
              block = "    " + "\n    ".join(missing) + "\n"
              src = src.replace("<application", block + "    <application", 1)
          # QR scanning camera is optional so the app still installs on
          # devices without a camera; manual session-ID entry still works.
          if "uses-feature" not in src:
              src = src.replace(
                  "<application",
                  '    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application', 1)
          # The classroom server speaks plain HTTP on a local network, and
          # Android blocks cleartext by default from API 28. Without this the
          # student's app cannot reach the teacher's phone at all, and the
          # teacher's own control calls to its own server are blocked too —
          # the QR scans, nothing happens.
          if "usesCleartextTraffic" not in src:
              src = re.sub(
                  r"<application\b",
                  '<application android:usesCleartextTraffic="true"',
                  src,
                  count=1,
              )
              print("cleartext enabled for the classroom LAN server")
          open(path, "w", encoding="utf-8").write(src)
          print("permissions patched")
          PY
          cat "$MANIFEST"

          # file_picker's transitive deps require compiling against Android 36.
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/compileSdk *=.*/compileSdk = 36/' android/app/build.gradle.kts
            grep -n "compileSdk" android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i -E 's/(compileSdk(Version)?) .*/\1 36/' android/app/build.gradle
            grep -n "compileSdk" android/app/build.gradle
          fi


      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - run: flutter pub get

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      # Every build above runs `flutter create .` on a clean checkout, so
      # android/ is brand new each time and its bundled debug.keystore is a
      # brand new throwaway key. The generated template signs release builds
      # with signingConfigs.debug, which reads exactly that file — so every
      # release came out signed differently, and a phone that already had the
      # last version could not install this one over it. Android refuses with
      # "package appears to be invalid".
      #
      # .gitignore already has `!android/classcast-release-key.jks` for this and
      # gen-release-key.yml was written to create it, but nothing ever consumed
      # the key and the key was never committed. This is the missing half.
      - name: Stable signing key
        run: |
          set -euo pipefail
          KEY=android/classcast-release-key.jks

          if [ ! -f "$KEY" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::No committed signing key, and this is not a main" \
                "branch build. A tag build cannot mint the key, because the" \
                "key has to be committed before it can sign anything."
              exit 1
            fi
            echo "No committed signing key — minting one and committing it."
            keytool -genkeypair -v \
              -keystore "$KEY" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10950 \
              -dname "CN=ClassCast Offline, OU=MerjDev, O=MerjDev, C=PH"
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$KEY"
            git commit -m "Add the Android signing key

Every build ran 'flutter create .' on a clean checkout, which produces a brand
new throwaway debug key, and the generated template signs release builds with
signingConfigs.debug. Every release was therefore signed differently, so a
phone that had the last version installed could not install this one over it
and Android refused with 'the package appears to be invalid'. Committing the
key fixes the signature from here on.

It is a development-grade key carrying Flutter's own debug password, not a
release secret — the point is that it is the same key every time, not that it
is secret."
            git push origin HEAD:refs/heads/main
            echo "::notice::Committed the signing key. This push starts one more"
            echo "::notice::run; the next build is the first with a stable"
            echo "::notice::signature. This build is signed with the new key"
            echo "::notice::too, so it will not install over a pre-key build."
          fi

          # The generated template signs release builds with signingConfigs.debug,
          # which reads this exact path. Copying over it is the whole wiring.
          cp "$KEY" android/app/debug.keystore
          keytool -list -v \
            -keystore android/app/debug.keystore \
            -storepass android | head -5

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK (download from this run)
        uses: actions/upload-artifact@v4
        with:
          name: classcast-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
