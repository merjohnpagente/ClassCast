name: Build Android APK

# ClassCast Offline Android pipeline (JohnFood-style):
# TEST first, BUILD only when green. No Flutter SDK needed locally —
# everything runs here. GitHub Actions only builds the APK; the
# classroom local backend runs on the teacher device, not in CI.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---- 1) TEST: analyze + all tests. The APK waits for this. ----
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap platform folders if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name classcast_offline --org com.classcast.offline
          fi
          # flutter create drops a default counter test — ours are test/app_test.dart + test/widget_smoke_test.dart
          rm -f test/widget_test.dart
          git checkout -- web/index.html web/manifest.json || true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  # ---- 2) BUILD APK (only when Test is green) ----
  apk:
    name: APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap platform folders if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name classcast_offline --org com.classcast.offline
          fi
          rm -f test/widget_test.dart
          git checkout -- web/index.html web/manifest.json || true

      - name: Configure Android (label, permissions, compileSdk 36)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="ClassCast Offline"/' "$MANIFEST"

          # Permissions: QR scan (camera), Wi-Fi info for the joining address,
          # and local networking for the Android-hosted server (phase 6).
          # Insert before the closing <application> tag.
          python3 - "$MANIFEST" <<'PY'
          import sys, re
          path = sys.argv[1]
          src = open(path, encoding="utf-8").read()
          perms = [
              '<uses-permission android:name="android.permission.CAMERA"/>',
              '<uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>',
              '<uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>',
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>',
          ]
          missing = [p for p in perms if p not in src]
          if missing:
              block = "    " + "\n    ".join(missing) + "\n"
              src = src.replace("<application", block + "    <application", 1)
          # QR scanning camera is optional so the app still installs on
          # devices without a camera; manual session-ID entry still works.
          if "uses-feature" not in src:
              src = src.replace(
                  "<application",
                  '    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application', 1)
          open(path, "w", encoding="utf-8").write(src)
          print("permissions patched")
          PY
          cat "$MANIFEST"

          # file_picker's transitive deps require compiling against Android 36.
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/compileSdk *=.*/compileSdk = 36/' android/app/build.gradle.kts
            grep -n "compileSdk" android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i -E 's/(compileSdk(Version)?) .*/\1 36/' android/app/build.gradle
            grep -n "compileSdk" android/app/build.gradle
          fi

      - name: Force a CameraX that works on Android 11-15
        run: |
          # mobile_scanner 5.2.3 bundles CameraX 1.3.3 (2023) with ML Kit
          # 17.2. On Android 14/15 that pair frequently fails to bind the
          # camera ("No camera found or failed to open camera") even with the
          # permission granted, and ML Kit 17.2 throws a null pointer against
          # CameraX 1.4. These pins are the matching pair.
          #
          # configureEach, not afterEvaluate: appended at the end of the file
          # the projects are already evaluated, and afterEvaluate is a hard
          # error there. The injected block below carries no comments because
          # the file may be Kotlin DSL, where # is a syntax error.
          FILE=android/build.gradle.kts
          [ -f "$FILE" ] || FILE=android/build.gradle
          cat >> "$FILE" <<'EOF'

          subprojects {
              configurations.configureEach {
                  resolutionStrategy {
                      force("androidx.camera:camera-core:1.4.2")
                      force("androidx.camera:camera-camera2:1.4.2")
                      force("androidx.camera:camera-lifecycle:1.4.2")
                      force("androidx.camera:camera-view:1.4.2")
                      force("com.google.mlkit:barcode-scanning:17.3.0")
                  }
              }
          }
          EOF
          tail -14 "$FILE"

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - run: flutter pub get

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK (download from this run)
        uses: actions/upload-artifact@v4
        with:
          name: classcast-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
