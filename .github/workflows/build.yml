name: Build ClassCast (APK + Web)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap platform folders if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name classcast_offline --org com.classcast.offline
          fi
          git checkout -- web/index.html web/manifest.json || true

      - name: Set Android app label
        run: |
          sed -i 's/android:label="[^"]*"/android:label="ClassCast Offline"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Build web
        run: flutter build web --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: classcast-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: classcast-web
          path: build/web

      - name: Attach builds to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
