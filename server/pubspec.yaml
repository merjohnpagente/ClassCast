name: classcast_server
description: Laptop-hosted local server for ClassCast Offline (Shelf HTTP + WebSocket).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3
  shelf_web_socket: ^2.0.1
  web_socket_channel: ^3.0.0
  path: ^1.9.0
  mime: ^2.0.0
  args: ^2.6.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
